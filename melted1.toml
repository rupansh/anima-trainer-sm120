# anima-trainer config for the melted1 dataset
# Knobs:
#   - optim.d0          — Prodigy+SF starting estimate; rarely needs changing.
#   - lokr.{factor,preset,full_matrix} — LoKr shape.
#   - train.{resolution,batch_size,max_train_epochs,save_every_n_epochs,precision,seed,gradient_checkpointing,num_workers}
#   - sample.every_n_epochs / sample.prompts_file

[paths]
dit            = "./models/anima-base-v1.0.safetensors"
qwen3          = "./models/qwen_3_06b_base.safetensors"
vae            = "./models/qwen_image_vae.safetensors"
train_data_dir = "./melted1-ds"
output_dir     = "./outputs/melted1"
cache_db       = "./outputs/melted1.cache.lance"

[train]
output_name              = "melted1"
resolution               = 1024
batch_size               = 8
max_train_epochs         = 15
save_every_n_epochs      = 15
precision                = "fp8"
seed                     = 42
gradient_checkpointing   = true
num_workers              = 4
# Whole-DiT and regional compile were neutral/slower on the production FP8
# LoKr path and add shape warmup. Keep eager unless the execution stack changes.
compile_mode             = ""

[optim]
# Match sd-scripts baseline (melted1-anima-config.toml:19). Prodigy+SF adapts
# d0 upward automatically, so 5e-5 here vs the library default of 1e-6 is
# only the *starting* estimate — it does not lock the learning rate.
d0 = 5e-05

[lokr]
factor      = 8
full_matrix = true
# anima-cross-mlp: cross-attn {q,k,v,output}_proj + MLP {layer1,layer2} per
# block. ~168 modules / ~17M params (vs anima-full's 454 / 30M). Highest-
# leverage subset for multi-character / multi-style LoRAs.
preset      = "anima-cross-mlp"

[sample]
every_n_epochs = 15
sampler        = "euler_a"
prompts_file   = "./melted1-ds-prompt.txt"
